# Marks vesper/ as its own pnpm installation root. Keep pnpm commands scoped
# to this folder even when a parent directory also has workspace metadata.
#
# "." stays a real workspace package after the Next.js application moved to
# apps/web: the root owns the operational surface — db/migration/seed scripts,
# evals, simulation errands, the CI helper tooling and the repository-wide
# gates. Removing it would turn every one of those into an app-local script.
packages:
  - "."
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
