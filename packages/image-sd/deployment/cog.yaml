# The Vesper-owned SDXL character renderer, as a Cog build.
#
# Everything that decides what an image looks like is pinned to an exact
# revision: the Python version, the CUDA version, the torch trio, ComfyUI at a
# commit, and the PuLID custom node at a commit. A renderer whose graph is
# frozen but whose nodes float is not frozen — see deployment/README.md.
#
# `predict:` is Cog's deprecated compatibility field for `run:`/`BaseRunner`.
# It is used deliberately: the predictor here is a `BasePredictor` with
# `setup()`/`predict()`, which is still supported, and migrating is a mechanical
# change (`cog doctor --fix`) that should happen on its own, not folded into the
# build that first proves this renderer works.

build:
  gpu: true
  # Pinned rather than inferred. Cog would pick a CUDA version from torch, and
  # "whatever Cog picked that week" is not a freeze. 12.6 is a published wheel
  # index for torch 2.13.0 and is what onnxruntime-gpu's default wheels target.
  cuda: "12.6"
  python_version: "3.12"
  system_packages:
    # ComfyUI and the PuLID node are cloned at exact commits below.
    - "git"
    # Static model artifacts are fetched while the image is built, not during
    # Predictor.setup(). Replicate recommends shipping weights with the model so
    # a cold worker does not spend its first prediction downloading ~15 GB.
    - "curl"
    # opencv (pulled in by facexlib and insightface) links against these; without
    # them the first `import cv2` dies with a libGL error at setup, not at build.
    - "libgl1"
    - "libglib2.0-0"
    # insightface builds native extensions when no wheel matches the interpreter.
    - "build-essential"
    - "cmake"
  python_requirements: requirements.txt
  run:
    # ComfyUI v0.33.1 (2026-08-13). The tag is resolved to its commit so the
    # build cannot move if the tag is ever repointed.
    - "git clone --filter=blob:none https://github.com/comfyanonymous/ComfyUI.git /ComfyUI"
    - "git -C /ComfyUI checkout 72865f4f27eaf5396f8f36370e0a2be3a9a090ee"
    - "pip install --no-cache-dir -r /ComfyUI/requirements.txt"
    # cubiq/PuLID_ComfyUI at the tip of `main` — commit "maintenance mode",
    # 2025-04-14, still the latest as of 2026-08-23. The repository is in the
    # author's declared "maintenance only" mode, which is a reason to pin it
    # rather than a reason to avoid it: the node's behaviour is now stable, and
    # the deployment owns the decision to move.
    - "git clone --filter=blob:none https://github.com/cubiq/PuLID_ComfyUI.git /ComfyUI/custom_nodes/PuLID_ComfyUI"
    - "git -C /ComfyUI/custom_nodes/PuLID_ComfyUI checkout 93e0c4c226b87b23c0009d671978bad0e77289ff"
    # PATCH: the PuLID node's middle-block attention key.
    #
    # `ApplyPulid` registers its 70 attention patches under ("input", id, i),
    # ("output", id, i) and ("middle", 1, i) — pulid.py:459 at the commit above.
    # ComfyUI v0.33.1 sets the middle block's patch key to ("middle", 0)
    # (openaimodel.py:893) and looks patches up as ("middle", 0, i) with a
    # ("middle", 0) fallback (attention.py:1033, 1077-1081). The ten middle-block
    # registrations therefore never fire, and identity conditioning silently
    # applies at the input and output cross-attention blocks only.
    #
    # Owner ruling 2026-08-23: patch it at build time rather than ship the
    # weakened behaviour. See deployment/README.md — this makes Vesper's PuLID
    # diverge from every public ComfyUI PuLID pipeline, which Stage 3 comparisons
    # have to account for.
    #
    # Guarded on both sides. If the expected call site is ever absent — a bumped
    # node commit, an upstream fix — the build FAILS with the reason instead of
    # quietly skipping the patch and producing a renderer whose identity strength
    # nobody can explain.
    - "grep -qF 'set_model_patch_replace(work_model, patch_kwargs, (\"middle\", 1, index))' /ComfyUI/custom_nodes/PuLID_ComfyUI/pulid.py || { echo 'FATAL: the PuLID middle-block patch no longer applies - pulid.py at this commit does not contain the expected (\"middle\", 1, index) call site. Re-verify the node against ComfyUI attention.py before bumping the pin, then update this step. See deployment/README.md.'; exit 1; }"
    - "sed -i 's/(\"middle\", 1, index)/(\"middle\", 0, index)/' /ComfyUI/custom_nodes/PuLID_ComfyUI/pulid.py"
    - "grep -qF 'set_model_patch_replace(work_model, patch_kwargs, (\"middle\", 0, index))' /ComfyUI/custom_nodes/PuLID_ComfyUI/pulid.py || { echo 'FATAL: the PuLID middle-block patch did not apply - pulid.py does not contain the patched (\"middle\", 0, index) call site.'; exit 1; }"
    # insightface hard-depends on the CPU `onnxruntime` distribution, which pip
    # installs from requirements.txt ALONGSIDE `onnxruntime-gpu`. Both ship the
    # same `onnxruntime/` package directory, including `capi/`, so whichever pip
    # unpacks second wins — and if that is the CPU build, `CUDAExecutionProvider`
    # disappears and PulidInsightFaceLoader's "CUDA" provider degrades silently
    # to a much slower CPU detector instead of failing. Give the GPU build the
    # last word explicitly rather than trusting resolver order.
    - "pip uninstall -y onnxruntime && pip install --no-cache-dir --force-reinstall --no-deps onnxruntime-gpu==1.29.0"

    # Bake every immutable model artifact into the image. Predictor.setup() is
    # intentionally still idempotent and still knows how to download a missing
    # artifact, but a correctly built Replicate image reaches that code with all
    # twelve plain files already present. This moves the ~15 GB transfer from a
    # billed cold prediction into the image build/push and keeps warm behaviour
    # unchanged. URLs and digests mirror weights_manifest.json; the sync checker
    # in scripts/check_weight_bake_sync.py prevents the two declarations drifting.
    - |
      set -eu
      fetch_weight() {
        url="$1"
        destination="$2"
        expected="$3"
        mkdir -p "$(dirname "$destination")"
        partial="${destination}.partial"
        rm -f "$partial"
        echo "baking $(basename "$destination")"
        curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
          --output "$partial" "$url"
        actual="$(sha256sum "$partial" | cut -d ' ' -f 1)"
        if [ "$actual" != "$expected" ]; then
          rm -f "$partial"
          echo "FATAL: $(basename "$destination") sha256 $actual != pinned $expected" >&2
          exit 1
        fi
        mv "$partial" "$destination"
      }

      fetch_weight \
        "https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0/resolve/main/sd_xl_base_1.0.safetensors" \
        "/ComfyUI/models/checkpoints/sd_xl_base_1.0.safetensors" \
        "31e35c80fc4829d14f90153f4c74cd59c90b779f6afe05a74cd6120b893f7e5b"
      fetch_weight \
        "https://huggingface.co/huchenlei/ipadapter_pulid/resolve/main/ip-adapter_pulid_sdxl_fp16.safetensors" \
        "/ComfyUI/models/pulid/ip-adapter_pulid_sdxl_fp16.safetensors" \
        "b258a5cd2c0c7d35f4d3e59909d7648498686afae4d0c74917e9c47d7704fbf5"
      fetch_weight \
        "https://huggingface.co/MonsterMMORPG/tools/resolve/main/1k3d68.onnx" \
        "/ComfyUI/models/insightface/models/antelopev2/1k3d68.onnx" \
        "df5c06b8a0c12e422b2ed8947b8869faa4105387f199c477af038aa01f9a45cc"
      fetch_weight \
        "https://huggingface.co/MonsterMMORPG/tools/resolve/main/2d106det.onnx" \
        "/ComfyUI/models/insightface/models/antelopev2/2d106det.onnx" \
        "f001b856447c413801ef5c42091ed0cd516fcd21f2d6b79635b1e733a7109dbf"
      fetch_weight \
        "https://huggingface.co/MonsterMMORPG/tools/resolve/main/genderage.onnx" \
        "/ComfyUI/models/insightface/models/antelopev2/genderage.onnx" \
        "4fde69b1c810857b88c64a335084f1c3fe8f01246c9a191b48c7bb756d6652fb"
      fetch_weight \
        "https://huggingface.co/MonsterMMORPG/tools/resolve/main/glintr100.onnx" \
        "/ComfyUI/models/insightface/models/antelopev2/glintr100.onnx" \
        "4ab1d6435d639628a6f3e5008dd4f929edf4c4124b1a7169e1048f9fef534cdf"
      fetch_weight \
        "https://huggingface.co/MonsterMMORPG/tools/resolve/main/scrfd_10g_bnkps.onnx" \
        "/ComfyUI/models/insightface/models/antelopev2/scrfd_10g_bnkps.onnx" \
        "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"

      FACEXLIB_DIR="$(python -c 'import pathlib, facexlib; print(pathlib.Path(facexlib.__file__).resolve().parent)')"
      fetch_weight \
        "https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth" \
        "$FACEXLIB_DIR/weights/detection_Resnet50_Final.pth" \
        "6d1de9c2944f2ccddca5f5e010ea5ae64a39845a86311af6fdf30841b0a5a16d"
      fetch_weight \
        "https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth" \
        "$FACEXLIB_DIR/weights/parsing_parsenet.pth" \
        "3d558d8d0e42c20224f13cf5a29c79eba2d59913419f945545d8cf7b72920de2"
      fetch_weight \
        "https://github.com/xinntao/facexlib/releases/download/v0.2.0/parsing_bisenet.pth" \
        "$FACEXLIB_DIR/weights/parsing_bisenet.pth" \
        "468e13ca13a9b43cc0881a9f99083a430e9c0a38abd935431d1c28ee94b26567"
      fetch_weight \
        "https://huggingface.co/xinsir/controlnet-depth-sdxl-1.0/resolve/main/diffusion_pytorch_model.safetensors" \
        "/ComfyUI/models/controlnet/controlnet-depth-sdxl-1.0.safetensors" \
        "ea3770af4c33ea8ba8dccc0106ec5d5c5c6e504eb382119a3ccac3c9d973d344"
      fetch_weight \
        "https://huggingface.co/xinsir/controlnet-openpose-sdxl-1.0/resolve/main/diffusion_pytorch_model.safetensors" \
        "/ComfyUI/models/controlnet/controlnet-openpose-sdxl-1.0.safetensors" \
        "b8524e557a7df60d081f5d4a0eb109967d107df217943bf88c2d99b9ebcc06c5"

    # EVA-CLIP is the one exception to the plain-file paths above. PuLID asks
    # huggingface_hub for this repo/file at runtime, so bake it into the exact
    # cache tree huggingface_hub will read instead of merely placing the bytes
    # somewhere nearby. Runtime setup will resolve this cached snapshot and only
    # perform its existing integrity check; it will not transfer the 1.7 GB file.
    - |
      set -eu
      mkdir -p /hf-cache/hub
      EVA_PATH="$(HF_HOME=/hf-cache python -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="QuanSun/EVA-CLIP", filename="EVA02_CLIP_L_336_psz14_s6B.pt", cache_dir="/hf-cache/hub"))')"
      EVA_SHA="$(sha256sum "$EVA_PATH" | cut -d ' ' -f 1)"
      if [ "$EVA_SHA" != "84c3a17a228c567a155259b2245b0b59072bf7da510260a0a02ec54de6d50b05" ]; then
        echo "FATAL: EVA02_CLIP_L_336_psz14_s6B.pt sha256 $EVA_SHA != pinned 84c3a17a228c567a155259b2245b0b59072bf7da510260a0a02ec54de6d50b05" >&2
        exit 1
      fi

predict: "predict.py:Predictor"
