openapi: 3.1.0
info:
  title: Vesper Characters API
  version: 0.1.0
  description: >-
    Authenticated character-library and authoring API. Covers discovery, create/update/delete,
    cloning, forge drafting, relationship defaults, the main portrait-generation surface, and the
    reference-view build, review and upload operations. Identity-pack operations and reference-view
    history and restoration remain a follow-up for this first pass.
servers:
  - url: /
x-vesper-auth: Authenticated Vesper user session required.
tags:
  - name: Characters
  - name: Authoring
  - name: Relationships
  - name: Portraits
  - name: Reference views
paths:
  /api/characters:
    get:
      tags: [Characters]
      summary: List discoverable characters
      x-vesper-source: apps/web/src/app/api/characters/route.ts
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - in: query
          name: tag
          schema: { type: string }
          description: Comma-separated tags; tags are ANDed server-side.
        - in: query
          name: sort
          schema: { type: string, enum: [updated, name] }
        - in: query
          name: scope
          schema: { type: string, enum: [owned, public, all] }
          description: Defaults to owned.
      responses:
        '200':
          description: Search-ordered character summaries.
          content:
            application/json:
              schema:
                type: object
                required: [characters]
                properties:
                  characters:
                    type: array
                    items: { $ref: '#/components/schemas/CharacterSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Characters]
      summary: Create a character
      description: >-
        Creates the character and materializes its suggested items in one transaction. A profile with
        no attributes is seeded with the registry's core-visual defaults and the body configuration
        they imply. The body is strict; unknown fields are refused with invalid_body.
      x-vesper-source: apps/web/src/app/api/characters/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterCreateRequest' }
      responses:
        '201':
          description: Character created, with diagnostics and the index-to-item receipt for suggestedItems.
          content:
            application/json:
              schema:
                type: object
                required: [character, diagnostics, materializedSuggestions]
                properties:
                  character: { $ref: '#/components/schemas/Character' }
                  diagnostics:
                    type: array
                    items: { type: object, additionalProperties: true }
                  materializedSuggestions:
                    type: array
                    items:
                      type: object
                      required: [index, itemId]
                      properties:
                        index: { type: integer, minimum: 0 }
                        itemId: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      summary: Read an owned or public character
      description: Public reads are projected/allow-listed and include a read-only mine flag.
      x-vesper-source: apps/web/src/app/api/characters/[id]/route.ts
      responses:
        '200':
          description: Character detail plus public-safe portrait strip and owner-only acceptance state when applicable.
          content:
            application/json:
              schema:
                type: object
                required: [character, portraits, mine]
                properties:
                  character: { $ref: '#/components/schemas/Character' }
                  portraits:
                    type: array
                    items: { type: object, additionalProperties: true }
                  mine: { type: boolean }
                  acceptance: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Characters]
      summary: Update an owned character
      x-vesper-source: apps/web/src/app/api/characters/[id]/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterPatchRequest' }
      responses:
        '200':
          description: Saved character plus diagnostics/materialized forge suggestions.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409':
          description: Optimistic character-content conflict.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Characters]
      summary: Delete an owned character
      description: Also deletes chats containing the character and non-Gallery character assets.
      x-vesper-source: apps/web/src/app/api/characters/[id]/route.ts
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/clone:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Characters]
      summary: Clone a character into the caller's private library
      x-vesper-source: apps/web/src/app/api/characters/[id]/clone/route.ts
      requestBody:
        required: false
      responses:
        '201':
          description: Clone created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedRef' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/forge:
    post:
      tags: [Authoring]
      summary: Draft or redraft character content with the forge
      x-vesper-source: apps/web/src/app/api/characters/forge/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                mode: { type: string, enum: [create, fill, redraft] }
                section: { type: string, enum: [profile, attributes, outfit] }
                scope:
                  type: string
                  description: Character-sheet scope accepted by the shared CharacterSheetScope contract.
                draft: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Forge draft and diagnostics.
          content:
            application/json:
              schema:
                type: object
                required: [draft, diagnostics]
                properties:
                  draft: { type: object, additionalProperties: true }
                  diagnostics:
                    type: array
                    items: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/authoring-runs:
    get:
      tags: [Authoring]
      summary: List a saved character's persisted authoring runs
      description: >-
        The newest 25 runs for one owned saved character, excluding dismissed runs. A stored run whose
        payload cannot be read is omitted with an authoring.run.malformed diagnostic. Saved characters
        are the only target; the retired creation kind always returns no runs and one
        authoring.run.unsupported_target warning, so a page loaded before the change stops polling.
      x-vesper-source: apps/web/src/app/api/characters/authoring-runs/route.ts
      parameters:
        - in: query
          name: targetKind
          required: true
          schema: { type: string, enum: [character, creation] }
        - in: query
          name: targetId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Runs, newest first, and read diagnostics.
          content:
            application/json:
              schema:
                type: object
                required: [runs, diagnostics]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/AuthoringRun' }
                  diagnostics:
                    type: array
                    items: { type: object, additionalProperties: true }
        '400':
          description: invalid_query for a missing or unknown targetKind or targetId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Authoring]
      summary: Start a persisted Forge, completion, rewrite or portrait-read run on a saved character
      description: >-
        requestId is the idempotency key: repeating the same request returns the stored run without
        new provider work, and a different request under the same id is refused. The server reserves
        the character at source.authoringRevision and reconstructs base from that row; the browser
        base is ignored. For a create run it also derives creationStart and ignores the browser's
        creationStart.draft and initialPreview. The run forges from the character's saved
        creationBrief when present, otherwise from creationStart.prompt, and a changed prompt is a
        different request. With neither brief the start is refused before admission. The brief
        reaches the character only when the result is accepted.
      x-vesper-source: apps/web/src/app/api/characters/authoring-runs/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAuthoringRunRequest' }
      responses:
        '202':
          description: The run was started or an identical request was replayed.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/AuthoringRun' }
        '400':
          description: >-
            invalid_body, including a create run when neither the character nor creationStart.prompt
            carries a brief.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: not_found; the character is not owned by the caller or no longer exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >-
            authoring_revision_changed, portrait_changed or portrait_source_changed (with the current
            authoringRevision and avatarImageId), invalid_source, admission_pending or
            idempotency_conflict.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '429':
          description: Concurrent-job cap or daily text budget reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: The text provider lane is unhealthy or the work queue is saturated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/authoring-runs/{runId}/decision:
    parameters:
      - $ref: '#/components/parameters/RunId'
    patch:
      tags: [Authoring]
      summary: Accept, reject, undo or dismiss a run's proposal
      description: >-
        Compares the proposal revision and, except for dismiss, the saved character's authoring
        revision inside one transaction. Accept applies a three-way merge against the run's base;
        overlapping saved edits return authoring_conflict with the conflicting changes. Accepting a
        create run also stores its brief when the character has none. A stored run that cannot be read,
        including one from the removed creation draft, returns invalid_run.
      x-vesper-source: apps/web/src/app/api/characters/authoring-runs/[runId]/decision/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideAuthoringRunRequest' }
      responses:
        '200':
          description: The decided run.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/AuthoringRun' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            invalid_run, proposal_changed, portrait_source_changed, invalid_source, or
            authoring_conflict with conflicts and the current authoringRevision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/authoring-runs/{runId}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Authoring]
      summary: Retry a run from its immutable accepted source
      description: >-
        Starts a new run linked to the same root with the original base, create snapshot and source.
        Concurrent retries of one root coalesce. A portrait read is refused when the portrait or its
        relevant appearance facts changed.
      x-vesper-source: apps/web/src/app/api/characters/authoring-runs/[runId]/retry/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '202':
          description: The retry run.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: { $ref: '#/components/schemas/AuthoringRun' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: admission_pending, invalid_source, portrait_source_changed or idempotency_conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: Concurrent-job cap or daily text budget reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: The text provider lane is unhealthy or the work queue is saturated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/relationships:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Relationships]
      summary: Read the character's library-default outgoing relationship edges
      x-vesper-source: apps/web/src/app/api/characters/[id]/relationships/route.ts
      responses:
        '200':
          description: Edge set and revision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Relationships]
      summary: Replace the character's default outgoing relationship edge set
      x-vesper-source: apps/web/src/app/api/characters/[id]/relationships/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision, edges]
              properties:
                baseRevision: { type: integer, minimum: 1 }
                edges:
                  type: array
                  items:
                    type: object
                    required: [toCharacterId, record]
                    properties:
                      toCharacterId: { type: string }
                      record: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Saved edge set and new revision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409':
          description: Stale relationship revision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/portraits:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Portraits]
      summary: List owner-visible character portraits and render state
      x-vesper-source: apps/web/src/app/api/characters/[id]/portraits/route.ts
      parameters:
        - in: query
          name: modelId
          schema: { type: string }
          description: Optional current profile-picker model id used to compute replay hints.
      responses:
        '200':
          description: Portrait list, live-job flag and replay hints.
          content:
            application/json:
              schema:
                type: object
                required: [portraits, rendering, replay]
                properties:
                  portraits:
                    type: array
                    items: { type: object, additionalProperties: true }
                  rendering: { type: boolean }
                  replay: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Portraits]
      summary: Queue an identity-locked portrait variant
      x-vesper-source: apps/web/src/app/api/characters/[id]/portraits/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, instruction]
              properties:
                kind:
                  type: string
                  description: Portrait variant kind accepted by portraitVariantKindSchema.
                instruction: { type: string, minLength: 1, maxLength: 1000 }
                modelId: { type: string, maxLength: 64 }
      responses:
        '202':
          description: Portrait job queued.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, characterId]
                properties:
                  jobId: { type: string }
                  characterId: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/reference-views:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Reference views]
      summary: Read every reference-view slot and how many views a full build would render
      description: >-
        A pure read. Every angle × wardrobe slot is reported; a slot the age-gated plan withholds is
        ineligible. Each slot says whether it waits on its upstream view and what approving it, or
        uploading into it, would build. The character's body images, the inputs every view is
        built with, are read beside the sheet.
      x-vesper-source: apps/web/src/app/api/characters/[id]/reference-views/route.ts
      responses:
        '200':
          description: The sheet, the planned count and the body images.
          content:
            application/json:
              schema:
                type: object
                required: [set, planned, bodyReferences]
                properties:
                  set: { $ref: '#/components/schemas/ReferenceViewSet' }
                  planned: { type: integer, minimum: 0 }
                  bodyReferences: { $ref: '#/components/schemas/BodyReferenceSet' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/reference-views/build:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Reference views]
      summary: Build every slot that is ready to build
      description: >-
        Claims every planned slot that is missing, failed or stale and whose upstream view is
        approved — on a fresh character, the front clothed view alone — and charges the daily image
        budget for exactly the newly claimed slots. Rejected slots are never rebuilt here.
      x-vesper-source: apps/web/src/app/api/characters/[id]/reference-views/build/route.ts
      responses:
        '200':
          description: The admission outcome; a refusal is a value, not an error.
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views: { $ref: '#/components/schemas/ReferenceViewQueueOutcome' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: not_accepted — the character has no accepted portrait to build from.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/reference-views/regenerate:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Reference views]
      summary: Rebuild the named slots as one batch
      description: >-
        One plan check, one admission, one charge. A slot the plan withholds refuses the whole
        request with 404; a slot still waiting on an unapproved upstream view, or one built from
        another slot the same request names, refuses it with 409 waiting. Nothing is charged for a
        refused request.
      x-vesper-source: apps/web/src/app/api/characters/[id]/reference-views/regenerate/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: { $ref: '#/components/schemas/ReferenceViewSlot' }
      responses:
        '200':
          description: The admission outcome.
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views: { $ref: '#/components/schemas/ReferenceViewQueueOutcome' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            not_accepted, or waiting — a named slot's upstream view is not approved, or a named slot
            is built from another named slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/reference-views/{angleId}/{wardrobe}/regenerate:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/ReferenceViewAngleId'
      - $ref: '#/components/parameters/ReferenceViewWardrobe'
    post:
      tags: [Reference views]
      summary: Rebuild one slot — the one-target form of the batch route
      x-vesper-source: apps/web/src/app/api/characters/[id]/reference-views/[angleId]/[wardrobe]/regenerate/route.ts
      responses:
        '200':
          description: The admission outcome.
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views: { $ref: '#/components/schemas/ReferenceViewQueueOutcome' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: not_accepted, or waiting — the slot's upstream view is not approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/reference-views/{angleId}/{wardrobe}/review:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/ReferenceViewAngleId'
      - $ref: '#/components/parameters/ReferenceViewWardrobe'
    post:
      tags: [Reference views]
      summary: Approve, reject or undo the displayed attempt
      description: >-
        Conditional on the displayed attempt id and review revision. An approval is a spending
        action: once it commits, the views built from this one that are then missing, failed or
        stale are admitted, charged and queued as one build, reported as dependents. The verdict
        stands whatever the queue answers. A rejection or an undo queues nothing.
      x-vesper-source: apps/web/src/app/api/characters/[id]/reference-views/[angleId]/[wardrobe]/review/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, expectedRevision, verdict]
              properties:
                attemptId: { type: string, minLength: 1, maxLength: 128 }
                expectedRevision: { type: integer, minimum: 0 }
                verdict: { type: string, enum: [approve, reject, undo] }
                feedback:
                  type: object
                  required: [reasons, correction]
                  properties:
                    reasons:
                      type: array
                      items:
                        type: string
                        enum: [wrong_outfit, wrong_angle, identity_mismatch, image_defect]
                    correction: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: The settled slot and what the write queued downstream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceViewWriteResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            not_ready, changed, incompatible (including a view whose upstream view was replaced),
            ineligible, busy, expired or unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/reference-views/{angleId}/{wardrobe}/upload:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/ReferenceViewAngleId'
      - $ref: '#/components/parameters/ReferenceViewWardrobe'
    post:
      tags: [Reference views]
      summary: Replace one slot with an owner-supplied image
      description: >-
        Synchronous and model-free; the installed view arrives approved. Because an upload is an
        approval, the views built from this slot are then queued and charged, reported as
        dependents.
      x-vesper-source: apps/web/src/app/api/characters/[id]/reference-views/[angleId]/[wardrobe]/upload/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataUrl]
              properties:
                dataUrl: { type: string, minLength: 1, maxLength: 3000000 }
      responses:
        '201':
          description: The installed slot and what the upload queued downstream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceViewWriteResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: not_accepted, busy, ineligible or changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/body-references/{slot}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/BodyReferenceSlot'
    patch:
      tags: [Reference views]
      summary: Re-tag one body image
      description: >-
        Names the image the owner saw. Marks the reference views out of date and builds nothing.
        Tagging an image unclothed for a character below the adult gate is refused.
      x-vesper-source: apps/web/src/app/api/characters/[id]/body-references/[slot]/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, expectedImageId]
              properties:
                tag: { type: string, enum: [clothed, unclothed] }
                expectedImageId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The character's body images after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyReferenceWriteResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: ineligible or changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reference views]
      summary: Remove one body image
      description: >-
        Retires exactly the image the owner saw; its bytes wait out the retention window. Marks the
        reference views out of date and builds nothing.
      x-vesper-source: apps/web/src/app/api/characters/[id]/body-references/[slot]/route.ts
      parameters:
        - in: query
          name: imageId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The character's body images after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyReferenceWriteResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

  /api/characters/{id}/body-references/{slot}/upload:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/BodyReferenceSlot'
    post:
      tags: [Reference views]
      summary: Put an owner-supplied full-body image in one slot
      description: >-
        Fills an empty slot (expectedImageId null) or replaces the image the owner saw; the
        replaced image is retired. Synchronous, model-free and uncharged; marks the reference views
        out of date and builds nothing. There are two slots, so any other slot is a 404.
      x-vesper-source: apps/web/src/app/api/characters/[id]/body-references/[slot]/upload/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataUrl, tag, expectedImageId]
              properties:
                dataUrl: { type: string, minLength: 1, maxLength: 3000000 }
                tag: { type: string, enum: [clothed, unclothed] }
                expectedImageId: { type: [string, 'null'], maxLength: 128 }
      responses:
        '201':
          description: The character's body images after the write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyReferenceWriteResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: ineligible or changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }

components:
  parameters:
    CharacterId:
      in: path
      name: id
      required: true
      schema: { type: string }
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string }
    ReferenceViewAngleId:
      in: path
      name: angleId
      required: true
      schema: { type: string, enum: [front_full, back_full, side_left, side_right] }
    ReferenceViewWardrobe:
      in: path
      name: wardrobe
      required: true
      schema: { type: string, enum: [clothed, bare] }
    BodyReferenceSlot:
      in: path
      name: slot
      required: true
      schema: { type: string, enum: ['1', '2'] }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: true
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    CreatedRef:
      type: object
      required: [id]
      properties:
        id: { type: string }
    CharacterSummary:
      type: object
      required: [id, name, tags]
      properties:
        id: { type: string }
        name: { type: string }
        tags:
          type: array
          items: { type: string }
        avatarImageId: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
        speciesId: { type: [string, 'null'] }
        gender: { type: [string, 'null'] }
    Character:
      allOf:
        - $ref: '#/components/schemas/CharacterSummary'
        - type: object
          properties:
            profile: { type: object, additionalProperties: true }
            authoringRevision: { type: integer, minimum: 1 }
            visibility: { type: string, enum: [private, public] }
            chatModel: { type: string }
          additionalProperties: true
    CharacterCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        profile: { type: object, additionalProperties: true }
        tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 60 }
        suggestedItems:
          type: array
          maxItems: 50
          items: { type: object, additionalProperties: true }
    CharacterPatchRequest:
      type: object
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        expectedAuthoringRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        name: { type: string, minLength: 1, maxLength: 200 }
        profile: { type: object, additionalProperties: true }
        tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 60 }
        visibility: { type: string, enum: [private, public] }
        chatModel: { type: string, maxLength: 120 }
        suggestedItems:
          type: array
          maxItems: 50
          items: { type: object, additionalProperties: true }
      additionalProperties: false
    AuthoringRunTarget:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, const: character }
        id: { type: string, minLength: 1, maxLength: 128 }
    AuthoringSource:
      type: object
      required: [authoringRevision, imageId]
      properties:
        authoringRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        imageId: { type: [string, 'null'] }
        imageContentHash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        authoringFingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
    CreationStart:
      type: object
      required: [draft, prompt, initialPreview]
      properties:
        draft: { type: object, additionalProperties: true }
        prompt: { type: string }
        initialPreview: { type: boolean }
    StartAuthoringRunRequest:
      type: object
      required: [requestId, target, operation, scope, label, base, creationStart, source]
      properties:
        requestId: { type: string, minLength: 8, maxLength: 128 }
        target: { $ref: '#/components/schemas/AuthoringRunTarget' }
        operation: { type: string, enum: [create, fill, redraft, portrait] }
        scope:
          type: [string, 'null']
          description: Character-sheet scope; required for redraft.
        label: { type: string, minLength: 1, maxLength: 160 }
        base:
          type: object
          additionalProperties: true
          description: Ignored; the server reads the reserved character row.
        creationStart:
          description: >-
            Required for create and ignored otherwise. Only prompt is read; draft and initialPreview
            are replaced by the server.
          oneOf:
            - $ref: '#/components/schemas/CreationStart'
            - type: 'null'
        source:
          description: The saved authoring revision the run reserves; imageId is required for portrait.
          allOf:
            - $ref: '#/components/schemas/AuthoringSource'
    AuthoringRun:
      type: object
      required: [id, ownerId, target, operation, scope, label, base, creationStart, source, status, result, error, retryOf, rootRunId, persisted, proposal, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        target: { $ref: '#/components/schemas/AuthoringRunTarget' }
        operation: { type: string, enum: [create, fill, redraft, portrait] }
        scope: { type: [string, 'null'] }
        label: { type: string }
        base:
          type: object
          additionalProperties: true
          description: The reserved character content the run started from.
        creationStart:
          description: >-
            Create runs only. prompt is the brief the run forges from. initialPreview is true only
            when the character was an untouched blank at start (authoring revision 1, no saved brief,
            and profile and tags exactly as a blank create stores them) and the result, once present,
            is not degraded: no forge leg recorded a degraded, timeout, parse_failed or api_error
            line and nothing recorded an error. A client may then accept an unresolved completed
            result without review, sending source.authoringRevision as expectedAuthoringRevision, so
            any edit made meanwhile returns authoring_conflict. A degraded result is an ordinary
            proposal that can still be accepted or rejected.
          oneOf:
            - $ref: '#/components/schemas/CreationStart'
            - type: 'null'
        source:
          oneOf:
            - $ref: '#/components/schemas/AuthoringSource'
            - type: 'null'
        status: { type: string, enum: [pending, completed, failed] }
        result:
          type: [object, 'null']
          additionalProperties: true
          description: proposed draft, diagnostics and, for portrait reads, portrait evidence.
        error: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        retryOf: { type: [string, 'null'] }
        rootRunId: { type: string }
        persisted: { type: boolean, const: true }
        proposal:
          type: object
          additionalProperties: true
          description: revision, status (unresolved, accepted, rejected, undone, dismissed), decidedAt, choices, appliedDraft and undo.
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    ReferenceViewSlot:
      type: object
      required: [angle, wardrobe]
      properties:
        angle: { type: string, enum: [front_full, back_full, side_left, side_right] }
        wardrobe: { type: string, enum: [clothed, bare] }
    ReferenceViewSummary:
      type: object
      required: [angle, wardrobe, state, attemptId, reviewRevision, imageId, consumable, waitingOn, approvalBuilds, uploadBuilds]
      properties:
        angle: { type: string, enum: [front_full, back_full, side_left, side_right] }
        wardrobe: { type: string, enum: [clothed, bare] }
        state:
          type: string
          enum: [missing, pending, unreviewed, approved, rejected, failed, stale, ineligible]
        attemptId: { type: [string, 'null'] }
        reviewRevision: { type: integer, minimum: 0 }
        feedback: { type: [object, 'null'], additionalProperties: true }
        imageId: { type: [string, 'null'] }
        method: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
        failureMessage: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
        consumable: { type: boolean }
        waitingOn:
          description: The upstream slot this one builds from while that slot has no approved current attempt.
          oneOf:
            - $ref: '#/components/schemas/ReferenceViewSlot'
            - type: 'null'
        approvalBuilds:
          type: array
          description: What approving this slot's current attempt would build now; empty unless unreviewed.
          items: { $ref: '#/components/schemas/ReferenceViewSlot' }
        uploadBuilds:
          type: array
          description: What installing an upload in this slot would build now.
          items: { $ref: '#/components/schemas/ReferenceViewSlot' }
    BodyReferenceSet:
      type: object
      required: [images, unclothedAllowed, attributes]
      properties:
        images:
          type: array
          maxItems: 2
          items:
            type: object
            required: [slot, imageId, tag, withheld, updatedAt]
            properties:
              slot: { type: integer, enum: [1, 2] }
              imageId: { type: string }
              tag: { type: string, enum: [clothed, unclothed] }
              withheld: { type: boolean, description: An unclothed image the adult gate keeps from every render. }
              updatedAt: { type: [string, 'null'] }
        unclothedAllowed: { type: boolean }
        attributes:
          type: array
          description: The character's build-aspect attributes in the registry's words.
          items:
            type: object
            required: [id, label, value]
            properties:
              id: { type: string }
              label: { type: string }
              value: { type: string }
    BodyReferenceWriteResult:
      type: object
      required: [bodyReferences]
      properties:
        bodyReferences: { $ref: '#/components/schemas/BodyReferenceSet' }
    ReferenceViewSet:
      type: object
      required: [acceptedImageId, building, views]
      properties:
        acceptedImageId: { type: [string, 'null'] }
        building: { type: boolean }
        views:
          type: array
          items: { $ref: '#/components/schemas/ReferenceViewSummary' }
    ReferenceViewQueueOutcome:
      type: object
      required: [queued, reason, planned, admitted, targets]
      properties:
        queued: { type: boolean }
        reason: { type: [string, 'null'], enum: [budget, storage, busy, null] }
        planned: { type: integer, minimum: 0 }
        admitted: { type: integer, minimum: 0 }
        targets:
          type: array
          maxItems: 32
          items:
            allOf:
              - $ref: '#/components/schemas/ReferenceViewSlot'
              - type: object
                required: [state]
                properties:
                  state: { type: string, enum: [queued, busy, budget, storage] }
    ReferenceViewWriteResult:
      type: object
      required: [view, dependents]
      properties:
        view: { $ref: '#/components/schemas/ReferenceViewSummary' }
        dependents:
          description: What the write queued downstream — nothing for a rejection or an undo.
          allOf:
            - $ref: '#/components/schemas/ReferenceViewQueueOutcome'
    DecideAuthoringRunRequest:
      type: object
      required: [action, expectedProposalRevision]
      properties:
        action: { type: string, enum: [accept, reject, undo, dismiss] }
        expectedProposalRevision: { type: integer, minimum: 1 }
        expectedAuthoringRevision:
          type: integer
          minimum: 1
          description: Required for accept, reject and undo.
        choices:
          type: object
          additionalProperties: { type: string, enum: [current, proposed] }
