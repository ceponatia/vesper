openapi: 3.1.0
info:
  title: Vesper Chat Participant Inspector State API — Draft Target
  version: 0.0.1-draft
  description: >-
    Proposed admin/self-inspector home for engine carry-over and diagnostic participant state
    that is currently mixed into the ordinary owner chat-state read/write contract. This keeps
    gameplay resources focused while preserving the developer recovery/edit levers.
servers:
  - url: /
x-vesper-status: proposed-not-implemented
x-vesper-auth: Admin-role-gated and owner-scoped using the existing chat-inspector authorization model.
x-vesper-current-source: apps/web/src/app/api/chats/[chatId]/state/route.ts
x-vesper-proposed-canonical-route: /api/admin/chat-inspector/{chatId}/participants/{characterId}/state
x-vesper-proposed-self-mirror: /api/admin/self/chat-inspector/{chatId}/participants/{characterId}/state
x-vesper-design-invariants:
  - The canonical admin route and /self mirror must be added together and covered by the existing parity test.
  - Debug mutation must not be available through an ordinary owner gameplay route.
  - The same rollback-safe ChatState fields remain the persistence source; this is an authorization/API split, not a second store.
  - Read-only traces stay read-only even on the inspector surface unless a recovery use case explicitly requires otherwise.
tags:
  - name: Participant Inspector State
paths:
  /api/admin/self/chat-inspector/{chatId}/participants/{characterId}/state:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Participant Inspector State]
      operationId: getChatParticipantInspectorState
      summary: Read engine carry-over and diagnostic state for one roster character
      x-vesper-proposed-source: apps/web/src/app/api/admin/chat-inspector/[chatId]/participants/[characterId]/state/route.ts
      responses:
        '200':
          description: Inspector-only participant state and traces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectorStateView' }
        '404':
          description: Chat/participant not found, not owned, or caller is not permitted to use the inspector.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Participant Inspector State]
      operationId: patchChatParticipantInspectorState
      summary: Apply an explicit developer/recovery edit to engine carry-over state
      description: >-
        This is the intentional escape hatch for state-tools/recovery work. It replaces the
        inspector-grade fields currently accepted by the normal chat-state PATCH. It remains
        chat-busy protected because the exchange finalizer can rewrite the same state row.
      x-vesper-proposed-source: apps/web/src/app/api/admin/chat-inspector/[chatId]/participants/[characterId]/state/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectorStatePatch' }
      responses:
        '200':
          description: Inspector state updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectorStateView' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: chat_busy while an exchange/finalizer owns the row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    ChatId:
      in: path
      name: chatId
      required: true
      schema: { type: string, minLength: 1 }
    CharacterId:
      in: path
      name: characterId
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: true
    AttributeOverlay:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts/attributes/value.ts#attributeValueSchema
    TraitOverlay:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts#TraitValue
    CallbackEntry:
      type: object
      additionalProperties: false
      required: [ref, atClockMinutes]
      properties:
        ref: { type: string, maxLength: 80 }
        atClockMinutes: { type: number }
    FeelingState:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/server/engine/chat-feeling.ts#chatFeelingStateSchema
    SelfieEntry:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/server/engine/chat-selfie.ts#selfieHistorySchema
    ChatDrive:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts/personality/drives.ts
    VoiceExemplar:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/server/engine/chat-voice.ts
    InspectorStateView:
      type: object
      additionalProperties: false
      required:
        - openLoops
        - memoryQueries
        - surfacedCues
        - attributeOverlays
        - traitOverlays
        - voiceExemplars
        - callbackHistory
        - feeling
        - selfieHistory
        - drives
        - lastPulseTrace
        - lastMemoryTrace
      properties:
        openLoops:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 200 }
        memoryQueries:
          type: array
          maxItems: 6
          items: { type: string, maxLength: 200 }
        surfacedCues:
          type: object
          additionalProperties: { type: string }
        attributeOverlays:
          type: array
          items: { $ref: '#/components/schemas/AttributeOverlay' }
        traitOverlays:
          type: array
          items: { $ref: '#/components/schemas/TraitOverlay' }
        voiceExemplars:
          type: array
          items: { $ref: '#/components/schemas/VoiceExemplar' }
        callbackHistory:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CallbackEntry' }
        feeling: { $ref: '#/components/schemas/FeelingState' }
        selfieHistory:
          type: array
          items: { $ref: '#/components/schemas/SelfieEntry' }
        drives:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ChatDrive' }
        lastPulseTrace:
          type: object
          readOnly: true
          additionalProperties: true
        lastMemoryTrace:
          type: object
          readOnly: true
          additionalProperties: true
    InspectorStatePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        openLoops:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 200 }
        memoryQueries:
          type: array
          maxItems: 6
          items: { type: string, maxLength: 200 }
        surfacedCues:
          type: object
          additionalProperties: { type: string }
        attributeOverlays:
          type: array
          items: { $ref: '#/components/schemas/AttributeOverlay' }
        traitOverlays:
          type: array
          items: { $ref: '#/components/schemas/TraitOverlay' }
        voiceExemplars:
          type: array
          items: { $ref: '#/components/schemas/VoiceExemplar' }
        callbackHistory:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CallbackEntry' }
        feeling: { $ref: '#/components/schemas/FeelingState' }
        selfieHistory:
          type: array
          items: { $ref: '#/components/schemas/SelfieEntry' }
        drives:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ChatDrive' }
