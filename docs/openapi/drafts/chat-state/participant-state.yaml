openapi: 3.1.0
info:
  title: Vesper Chat Participant State API — Draft Target
  version: 0.0.1-draft
  description: >-
    Proposed per-character state resource extracted from PATCH /api/chats/{chatId}/state.
    It owns live participant psychology/state but intentionally excludes wardrobe,
    chat-wide scenario data, player identity, presence, and engine/debug bookkeeping.
servers:
  - url: /
x-vesper-status: proposed-not-implemented
x-vesper-auth: Authenticated owner of the chat; characterId must be in the chat roster.
x-vesper-current-source: apps/web/src/app/api/chats/[chatId]/state/route.ts
x-vesper-current-service: apps/web/src/server/engine/chat-state/edit.ts
x-vesper-storage-owner: ChatState on character_chat_state keyed by (chatId, characterId)
x-vesper-related-existing-routes:
  presence: PATCH /api/chats/{chatId}/participants/{characterId}
  relationship-matrix: GET/PUT /api/chats/{chatId}/relationships
  relationship-panel: GET /api/chats/{chatId}/relationship
x-vesper-design-invariants:
  - A participant-state write must not rewrite ChatScenario.
  - A rowless participant seeds from that character's authored defaults on first participant-state write.
  - The write remains protected from an in-flight finalizer by chat_busy.
  - World-owned successor values must not accept shadow writes that GET will immediately mask.
tags:
  - name: Participant State
paths:
  /api/chats/{chatId}/participants/{characterId}/state:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Participant State]
      operationId: getChatParticipantState
      summary: Read one roster character's focused live state
      description: >-
        Returns the Character Sheet's non-wardrobe participant state. A rowless member is
        projected from authored defaults with persisted=false. For a successor-routed primary,
        meters and relationship scalars are projected from world truth exactly as the current
        aggregate state GET does.
      x-vesper-proposed-source: apps/web/src/app/api/chats/[chatId]/participants/[characterId]/state/route.ts
      responses:
        '200':
          description: Participant state projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantStateView' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Participant State]
      operationId: patchChatParticipantState
      summary: Author-edit one roster character's focused live state
      description: >-
        Applies only per-character state fields. Presence stays on the existing participant
        PATCH. Wardrobe has its own resource. Engine carry-over/debug fields are intentionally
        absent. For a successor-routed primary, a request containing world-owned regard,
        familiarity, or meters must fail explicitly instead of writing compatibility state
        that the read path will mask.
      x-vesper-proposed-source: apps/web/src/app/api/chats/[chatId]/participants/[characterId]/state/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantStatePatch' }
      responses:
        '200':
          description: Participant state updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantStateView' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            chat_busy or sim_participant_state_managed_by_world when the patch attempts to
            override a value whose authority is the successor world.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    ChatId:
      in: path
      name: chatId
      required: true
      schema: { type: string, minLength: 1 }
    CharacterId:
      in: path
      name: characterId
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: true
    Band:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    RelationshipTexture:
      type: object
      additionalProperties: false
      required: [kind, history, looming]
      x-vesper-schema-source: apps/web/src/contracts/relationships/record.ts#relationshipTextureSchema
      properties:
        kind: { type: string, maxLength: 80 }
        history: { type: string, maxLength: 280 }
        presented:
          oneOf:
            - $ref: '#/components/schemas/PresentedMask'
            - type: 'null'
          description: Omit/null for an honest presentation.
        looming: { type: boolean }
    PresentedMask:
      type: object
      additionalProperties: false
      required: [lean, note]
      properties:
        lean:
          type: string
          enum: [masks_warmth, masks_dislike]
        note: { type: string, maxLength: 160 }
    ActiveCondition:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts#activeConditionSchema
    EmotionView:
      type: object
      additionalProperties: false
      required: [label, intensity]
      properties:
        label: { type: string }
        intensity: { type: number, minimum: 0, maximum: 1 }
    ParticipantStateView:
      type: object
      additionalProperties: false
      required:
        - characterId
        - persisted
        - regard
        - familiarity
        - regardBand
        - familiarityBand
        - relationship
        - emotion
        - meters
        - conditions
        - mindNote
        - whereabouts
      properties:
        characterId: { type: string }
        persisted:
          type: boolean
          description: False when this is a seed-on-read projection and no state row exists yet.
        regard:
          type: integer
          minimum: -100
          maximum: 100
        familiarity:
          type: integer
          minimum: 0
          maximum: 100
        regardBand: { $ref: '#/components/schemas/Band' }
        familiarityBand: { $ref: '#/components/schemas/Band' }
        relationship: { $ref: '#/components/schemas/RelationshipTexture' }
        emotion: { $ref: '#/components/schemas/EmotionView' }
        meters:
          type: object
          additionalProperties: { type: number }
          description: Meter registry values after the canonical clamp/projection rules.
        conditions:
          type: array
          items: { $ref: '#/components/schemas/ActiveCondition' }
        mindNote:
          type: string
          maxLength: 320
        whereabouts:
          type: string
          maxLength: 120
    ParticipantStatePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        regard:
          type: integer
          minimum: -100
          maximum: 100
          description: Exact live override used by the current Character Sheet slider.
        familiarity:
          type: integer
          minimum: 0
          maximum: 100
          description: Exact live override used by the current Character Sheet slider.
        relationship:
          $ref: '#/components/schemas/RelationshipTexture'
        meters:
          type: object
          additionalProperties: { type: number }
          description: Values are normalized by the canonical meter clamp rules.
        conditions:
          type: array
          items: { $ref: '#/components/schemas/ActiveCondition' }
        mindNote:
          type: string
          maxLength: 320
        whereabouts:
          type: string
          maxLength: 120
      x-vesper-excluded-current-fields:
        - premise
        - activeSocialCards
        - sceneAuto
        - sceneModel
        - supportingCast
        - plans
        - calendarStart
        - wornItemIds
        - outfitPresetId
        - outfit
        - outfitExposed
        - garmentOperations
        - playerState
        - openLoops
        - memoryQueries
        - surfacedCues
        - attributeOverlays
        - callbackHistory
        - feeling
        - selfieHistory
        - drives
