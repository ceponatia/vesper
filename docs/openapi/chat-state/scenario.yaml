openapi: 3.1.0
info:
  title: Vesper Chat Scenario API
  version: 1.0.0
  description: >-
    Focused chat-wide authoring resource extracted from the historical mixed
    PATCH /api/chats/{chatId}/state mutation surface.
servers:
  - url: /
x-vesper-status: implemented
x-vesper-auth: Authenticated owner of the chat.
x-vesper-source: apps/web/src/app/api/chats/[chatId]/scenario/route.ts
x-vesper-service: apps/web/src/server/engine/chat-state/focused-edit.ts#editChatScenario
x-vesper-storage-owner: ChatScenario on character_chats
x-vesper-invariants:
  - A scenario-only write does not seed, update, or persist a character_chat_state row.
  - Scenario writes remain rollback-safe through pre_exchange_scenario.
  - A write returns chat_busy while an exchange can overwrite the scenario object.
  - Player persona and wardrobe are excluded from this resource.
tags:
  - name: Chat Scenario
paths:
  /api/chats/{chatId}/scenario:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chat Scenario]
      operationId: getChatScenario
      summary: Read the chat-wide authoring scenario
      x-vesper-source: apps/web/src/app/api/chats/[chatId]/scenario/route.ts
      responses:
        '200':
          description: Current chat-wide scenario authoring projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioView' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Chat Scenario]
      operationId: patchChatScenario
      summary: Edit chat-wide scenario authoring fields
      description: >-
        Applies only supplied ChatScenario authoring fields. A successor/world-routed
        calendar is world authority and calendarStart returns
        sim_calendar_managed_by_world instead of shadow-writing compatibility state.
      x-vesper-source: apps/web/src/app/api/chats/[chatId]/scenario/route.ts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioPatch' }
      responses:
        '200':
          description: Scenario updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioView' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: chat_busy or sim_calendar_managed_by_world.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    ChatId:
      in: path
      name: chatId
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
          additionalProperties: true
    CalendarStart:
      type: object
      additionalProperties: false
      required: [year, month, day, hour, minute]
      x-vesper-schema-source: apps/web/src/lib/clock.ts#calendarStartSchema
      properties:
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
    SocialReactionCard:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts#socialReactionCardSchema
    SupportingCastMember:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts#supportingCastSchema
    ChatPlan:
      type: object
      additionalProperties: true
      x-vesper-schema-source: apps/web/src/contracts#chatPlansSchema
    ScenarioView:
      type: object
      additionalProperties: false
      required: [premise, activeSocialCards, sceneAuto, sceneModel, supportingCast, plans, calendarStart, clockMinutes]
      properties:
        premise: { type: string }
        activeSocialCards:
          type: array
          items: { $ref: '#/components/schemas/SocialReactionCard' }
        sceneAuto: { type: string, enum: [off, milestones] }
        sceneModel: { type: string, maxLength: 64 }
        supportingCast:
          type: array
          items: { $ref: '#/components/schemas/SupportingCastMember' }
        plans:
          type: array
          items: { $ref: '#/components/schemas/ChatPlan' }
        calendarStart: { $ref: '#/components/schemas/CalendarStart' }
        clockMinutes:
          type: number
          readOnly: true
    ScenarioPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        premise: { type: string }
        activeSocialCards:
          type: array
          items: { $ref: '#/components/schemas/SocialReactionCard' }
        sceneAuto: { type: string, enum: [off, milestones] }
        sceneModel: { type: string, maxLength: 64 }
        supportingCast:
          type: array
          items: { $ref: '#/components/schemas/SupportingCastMember' }
        plans:
          type: array
          items: { $ref: '#/components/schemas/ChatPlan' }
        calendarStart: { $ref: '#/components/schemas/CalendarStart' }
