services:
  postgres:
    build:
      context: ./docker/postgres
    image: vesper-postgres:pg17-pgvector
    container_name: vesper-postgres
    environment:
      POSTGRES_USER: vesper
      POSTGRES_PASSWORD: vesper_dev_password
      POSTGRES_DB: vesper_dev
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - vesper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesper -d vesper_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vesper_postgres_data:
