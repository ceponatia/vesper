name: Feature or plan
description: A thing to build. Use this for anything that would once have been a plan document.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This is the shape a plan-sized issue takes. Implementation stages become **sub-issues** of this
        one, created when the work actually starts; dependencies use GitHub's blocked-by relationship
        rather than prose.

        Project fields — Status, Horizon, Priority, Area, Effort — are set on the
        [board](https://github.com/users/ceponatia/projects/7) after filing. Don't guess them here.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: |
        One sentence, in the form: **A player / The owner / A developer can `<do something concrete>`
        so that `<observable consequence>`.** Name a person, not a system. Promise something
        observable — never "more robust", "cleaner", or "better". Internal work gets an honest
        internal outcome about a developer or the owner; don't invent a player benefit.
      placeholder: A player can watch a character's appearance carry forward between turns so that details stop resetting mid-scene.
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current state
      description: |
        What exists today, and what does not. If something is built but not yet accepted — waiting on a
        trial, an owner review, or a flag enable — say so and name what it waits on. Built is not accepted.
      placeholder: Nothing built yet. / The projection is live behind a per-chat switch that is off by default.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and delivery order
      description: |
        What gets built, in the order it lands. Each item should be something a person could pick up
        and finish. These become sub-issues once work starts, so write them as deliverables rather
        than as a design discussion.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: |
        What makes this done — and done means delivered *and* accepted. If acceptance needs a paid
        trial, a graded comparison, an owner review, or a flag enable, name it here.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals and boundaries
      description: What this deliberately does not cover, and anything it must not break.
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and rulings
      description: |
        Load-bearing product boundaries, and any decision already made. Date owner rulings:
        `Owner ruling (2026-08-26): …`
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: |
        Anything genuinely undecided. Add the `decision-needed` label if this issue cannot move until
        the owner rules on one of them.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Specs and system docs that stay in the repo — link them; they are the technical truth this
        issue implements. Related issues and PRs by number.
    validations:
      required: false
