name: Research or evaluation
description: A question to answer or a comparison to run, rather than something to build.
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        Research earns its keep by changing a decision. If no result would change what happens next,
        it is reading, not work — and probably does not need an issue.

        Project fields are set on the [board](https://github.com/users/ceponatia/projects/7) after filing.

  - type: textarea
    id: question
    attributes:
      label: The question
      description: One question, stated so that an answer is recognizable when it arrives.
      placeholder: Does an immersive-profile prompt shape beat the current default across the fixed narrator corpus?
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: What decision this unblocks
      description: |
        Name the thing that is waiting. If the answer would not move a default, promote a model,
        settle a ruling, or unblock another issue, say that plainly — it may still be worth doing,
        but it should be filed knowing that.
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: Method
      description: |
        How the answer gets produced — corpus, fixtures, instruments, number of runs, what is held
        constant, and whether comparisons are blinded. If an instrument does not exist yet, say so:
        building it is part of the work.
    validations:
      required: true

  - type: textarea
    id: bar
    attributes:
      label: What result would change the answer
      description: |
        Pre-register the bar before running. State what counts as a win, what counts as a null result,
        and what happens on a null — a comparison with no stated bar tends to end in a shrug.
      placeholder: Promote the challenger only if it wins on at least 6 of 10 corpus items with no regression on the identity checks.
    validations:
      required: true

  - type: dropdown
    id: cost
    attributes:
      label: Does this need owner spend
      description: Paid runs need the owner to authorize and usually to execute them.
      options:
        - "No — runs locally or on existing infrastructure"
        - "Yes — paid model or provider calls"
        - "Yes — paid training run"
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Prior trials, evidence documents, the specs involved, related issues.
    validations:
      required: false
