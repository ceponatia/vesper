name: CI

# Runs the project's canonical gates on every PR and push to the long-lived
# environment branches. The gates run as SEPARATE sequential steps, never the
# chained `pnpm verify` — the chain holds every process's memory at once and
# OOM-killed the runner from 2026-07-20 (type-aware ESLint alone peaks ~3 GB;
# the same reason CLAUDE.md bans `pnpm verify` locally). One process per step
# lets each fully exit and release its heap before the next starts. The job
# name below ("verify") is the status-check context that `prod` branch
# protection requires before a promotion PR can merge.
on:
  pull_request:
    branches: [main, prod, engine]
  push:
    branches: [main, prod, engine]

# A newer push to the same ref cancels the in-flight run — saves CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Skip the husky git-hook install in CI (no commits happen here).
          HUSKY: 0

      - name: Lint (type-aware, max-warnings 0)
        run: pnpm lint
        env:
          # Headroom for the type-aware pass — Node's default heap cap is
          # what actually OOMed, well under the runner's ~7 GB.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Circular-import check (madge)
        run: pnpm lint:cycles

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Pure test suite
        run: pnpm test

      - name: Copy-paste threshold (jscpd)
        run: pnpm jscpd

      - name: Gate 1 deterministic-path benchmark
        run: pnpm eval:engine-gate1

      - name: Start Postgres 17 + pgvector for successor engine
        run: docker compose up -d --wait

      - name: Apply migrations from zero
        run: pnpm db:migrate

      # E2.2/E2.3 steps retired 2026-07-21: E5.3 slice 1 deleted the item-transfer
      # stand-in lane (tests included) wholesale; their invariants now run under
      # E5.3 (material lane: transfers, idempotency, crash proofs) and E2.6 (soak:
      # outbox crash-resume, duplicate defense). The steps had pointed at the
      # deleted file ever since — masked by the verify-chain OOM fixed above.
      - name: E2.4 durable scheduler integration
        run: pnpm test:engine-e2-4

      - name: E2.5 forks, snapshots, and audit integration
        run: pnpm test:engine-e2-5

      - name: E2.6 Gate 2 soak (CI profile)
        run: pnpm test:engine-e2-6

      - name: E3.1 authoritative space integration
        run: pnpm test:engine-e3-1

      - name: E3.2 activities and claims integration
        run: pnpm test:engine-e3-2

      - name: E3.3 commitments and pressure integration
        run: pnpm test:engine-e3-3

      - name: E3.4 engagement substrate integration
        run: pnpm test:engine-e3-4

      - name: E3.5 arbiter, access, and Gate 3 corpus integration
        run: pnpm test:engine-e3-5

      - name: E4.1 perception and observation integration
        run: pnpm test:engine-e4-1

      - name: E4.2 assertions, beliefs, and gossip integration
        run: pnpm test:engine-e4-2

      - name: E4.3 narrative cuts, narrator boundary, and soft canon integration
        run: pnpm test:engine-e4-3

      - name: E4.4 memory indexing and eligibility-before-similarity integration
        run: pnpm test:engine-e4-4

      - name: E4.5 Gate 4 exit corpus
        run: pnpm test:engine-e4-5

      - name: E5.1 body substrate integration
        run: pnpm test:engine-e5-1

      - name: E5.2 rhythm, circadian pressure, and energy-read integration
        run: pnpm test:engine-e5-2

      - name: E5.3 honest material lane integration
        run: pnpm test:engine-e5-3

      - name: E5.4 households, means, and money-at-LOD integration
        run: pnpm test:engine-e5-4

      - name: E5.5 social ledger and consent integration
        run: pnpm test:engine-e5-5

      - name: E5.6 Gate 5 exit corpus
        run: pnpm test:engine-e5-6

      - name: E6.1 actor-LOD ledger integration
        run: pnpm test:engine-e6-1

      - name: E6.2 routine controller integration
        run: pnpm test:engine-e6-2

      - name: E6.3 dormant-lane integration
        run: pnpm test:engine-e6-3

      - name: E6.4 actor promotion and dependency-wake integration
        run: pnpm test:engine-e6-4

      - name: E6.5 Gate 6 exit corpus and scaling proof
        run: pnpm test:engine-e6-5

      - name: Rollout R1 authority flags and internal test world
        run: pnpm test:rollout-r1

      - name: Rollout R2 sim narrator over committed cuts
        run: pnpm test:rollout-r2

      - name: Rollout R3 sim routes under /chat/
        run: pnpm test:rollout-r3

      - name: Stop successor-engine database
        if: always()
        run: docker compose down -v
