name: CI

on:
  pull_request:
    branches: [main, prod]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: classify changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs: ${{ steps.classify.outputs.docs }}
      code: ${{ steps.classify.outputs.code }}
      integration: ${{ steps.classify.outputs.integration }}
      engine: ${{ steps.classify.outputs.engine }}
      build: ${{ steps.classify.outputs.build }}
      docker: ${{ steps.classify.outputs.docker }}
      safe_followup: ${{ steps.classify.outputs.safe_followup }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect safe documentation follow-up
        id: followup
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: .github/workflows/ci.yml
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-safe-followup.mjs

      - name: Collect changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          : > changed-files.txt
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "$zero_sha" ]]; then
            git diff-tree --no-commit-id --name-only --no-renames -r "$HEAD_SHA" > changed-files.txt
          else
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi
          echo "Changed files:"
          sed 's/^/  /' changed-files.txt

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SAFE_FOLLOWUP: ${{ steps.followup.outputs.safe_followup }}
          CHANGED_FILES_FILE: changed-files.txt
        run: node scripts/ci-classify.mjs

      - name: Summarize selection
        env:
          DOCS: ${{ steps.classify.outputs.docs }}
          CODE: ${{ steps.classify.outputs.code }}
          INTEGRATION: ${{ steps.classify.outputs.integration }}
          ENGINE: ${{ steps.classify.outputs.engine }}
          BUILD: ${{ steps.classify.outputs.build }}
          DOCKER: ${{ steps.classify.outputs.docker }}
          SAFE_FOLLOWUP: ${{ steps.classify.outputs.safe_followup }}
        run: |
          {
            echo '### CI selection'
            echo '| Gate | Selected |'
            echo '| --- | --- |'
            echo "| docs | $DOCS |"
            echo "| code | $CODE |"
            echo "| integration | $INTEGRATION |"
            echo "| engine benchmark | $ENGINE |"
            echo "| production build | $BUILD |"
            echo "| Docker build | $DOCKER |"
            echo "| safe documentation follow-up | $SAFE_FOLLOWUP |"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: documentation checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Links, section citations, retired-document references
        run: node scripts/check-docs.mjs

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-aware ESLint
        run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  static:
    name: static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Circular-import check
        run: pnpm lint:cycles
      - name: Route-authorization guard
        run: pnpm lint:authz
        env:
          # Use the actual PR base rather than assuming origin/main. This makes
          # prod-bound promotion PRs inspect the correct change range too.
          ROUTE_AUTHZ_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Workspace import integrity
        run: pnpm lint:package-boundaries
      - name: Workspace package resolution
        run: pnpm lint:package-resolution
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Copy-paste threshold
        run: pnpm jscpd

  unit-app:
    name: app unit tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Application pure-test shard
        run: pnpm exec vitest run --project=app --shard=${{ matrix.shard }}

  unit-packages:
    name: workspace package tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package-owned pure suites
        run: pnpm -r --workspace-concurrency=2 run test

  integration:
    name: engine integration (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres 17 and pgvector
        run: docker compose up -d --wait
      - name: Apply migrations from zero
        run: pnpm db:migrate
      - name: Curated integration shard
        run: pnpm test:engine -- --project=app-int --shard=${{ matrix.shard }}
        env:
          VESPER_ALLOW_LEGACY_ENGINE_TEST_PLAYER: 1
      - name: Gate 1 deterministic-path benchmark
        if: needs.changes.outputs.engine == 'true' && matrix.shard == '1/2'
        run: pnpm eval:engine-gate1
      - name: Capture database logs on failure
        if: failure()
        run: docker compose logs --no-color > postgres-ci.log || true
      - name: Stop integration database
        if: always()
        run: docker compose down -v

  production-build:
    name: production build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - name: Next.js production build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  docker-build:
    name: Docker packaging build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull=false -t vesper-ci:${{ github.sha }} .

  verify:
    name: verify
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - changes
      - docs
      - lint
      - static
      - unit-app
      - unit-packages
      - integration
      - production-build
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_APP_RESULT: ${{ needs.unit-app.result }}
          UNIT_PACKAGES_RESULT: ${{ needs.unit-packages.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          DOCS: ${{ needs.changes.outputs.docs }}
          CODE: ${{ needs.changes.outputs.code }}
          INTEGRATION: ${{ needs.changes.outputs.integration }}
          BUILD: ${{ needs.changes.outputs.build }}
          DOCKER: ${{ needs.changes.outputs.docker }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SAFE_FOLLOWUP: ${{ needs.changes.outputs.safe_followup }}
        run: |
          set -euo pipefail
          failed=0

          gate() {
            local name="$1" applicable="$2" result="$3"
            if [[ "$applicable" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "Required gate '$name' ended with: $result"
                failed=1
              fi
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "Gate '$name' ended with: $result"
              failed=1
            fi
          }

          gate "classify changes" true "$CHANGES_RESULT"
          gate "documentation checks" "$DOCS" "$DOCS_RESULT"
          gate "lint" "$CODE" "$LINT_RESULT"
          gate "static checks" "$CODE" "$STATIC_RESULT"
          gate "app unit tests" "$CODE" "$UNIT_APP_RESULT"
          gate "workspace package tests" "$CODE" "$UNIT_PACKAGES_RESULT"
          gate "engine integration" "$INTEGRATION" "$INTEGRATION_RESULT"
          gate "production build" "$BUILD" "$BUILD_RESULT"
          gate "Docker packaging build" "$DOCKER" "$DOCKER_RESULT"

          if [[ "$failed" != "0" ]]; then
            exit 1
          fi

          if [[ "$SAFE_FOLLOWUP" == "true" ]]; then
            echo "Safe documentation follow-up passed."
          elif [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Documentation-only change passed."
          else
            echo "All applicable CI gates passed."
          fi
