name: CI

# Milestone-gated CI on AWS CodeBuild runners (owner decision 2026-08-21).
# Jobs run on ephemeral CodeBuild hosts via `runs-on: codebuild-vesper-ci-…` —
# GitHub-native checks UI, AWS per-minute billing, zero idle cost. There is no
# local pre-push gate; this workflow is the repository verification gate, shared
# record, and promotion gate.
#
# Compute: every job except `integration` runs on CodeBuild Lambda via the
# unprivileged `vesper-ci-lambda` runner project (linux-lambda nodejs22;
# 4GB for classify/verify, 8GB for the heavier gates; hard 15-minute Lambda
# ceiling). `integration` stays on `vesper-ci`'s privileged EC2 default —
# it needs Docker, and a privileged project silently ignores Lambda label
# overrides, which is why two projects exist. Always keep the image token in
# Lambda labels; the image-omitted form silently falls back to EC2.
#
# Draft PRs bill nothing: every job is draft-guarded, so pushes to a draft run
# zero jobs. Marking a PR ready for review (`gh pr ready`) runs the full
# applicable suite and produces the aggregate `verify` result; `gh pr ready
# --undo` returns to free iteration. Manual dispatch (`gh workflow run CI --ref
# main`) is the deliberate pre-deploy verification and runs every gate.
# Documentation-only changes stop after classification; database and
# engine-specific work only runs when affected.
#
# Billing shape: CodeBuild bills each workflow job as its own build, so a job's
# fixed setup (checkout + install) costs as much as its work on short gates.
# Two consequences are designed for here. The Gate 1 benchmark is a step of the
# engine job rather than a job of its own — 25s of eval was paying a whole
# job's setup. And the production build, the slowest gate, runs on PRs only
# when the build surface itself moves; every other code PR is covered by the
# `gh workflow run CI --ref main` dispatch that precedes each deploy, which
# always builds. Lint, static checks, and the pure suite stay unconditional on
# every ready code PR.
on:
  pull_request:
    branches: [main, prod]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    # Draft gate for the whole workflow: every other job `needs` this one, so
    # skipping it here skips the entire suite for draft PRs at zero cost.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: codebuild-vesper-ci-lambda-${{ github.run_id }}-${{ github.run_attempt }}-linux-lambda-nodejs22-4GB
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      code: ${{ steps.classify.outputs.code }}
      integration: ${{ steps.classify.outputs.integration }}
      engine: ${{ steps.classify.outputs.engine }}
      build: ${{ steps.classify.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Manual runs are deliberate full verification runs.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "docs_only=false"
              echo "code=true"
              echo "integration=true"
              echo "engine=true"
              echo "build=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zero_sha="0000000000000000000000000000000000000000"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "$zero_sha" ]]; then
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > changed-files.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi

          echo "Changed files:"
          sed 's/^/  /' changed-files.txt

          docs_only=true
          code=false
          integration=false
          engine=false
          build=false

          # A promotion to prod is intentionally a full release-candidate run.
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "prod" ]]; then
            docs_only=false
            code=true
            integration=true
            engine=true
            build=true
          fi

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              docs/*|*.md|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*)
                ;;
              *)
                docs_only=false
                code=true
                ;;
            esac

            # ---- EC2 `engine integration` -------------------------------
            # The one job that cannot run on Lambda: it needs Docker Compose
            # for Postgres/pgvector, so it is the slowest gate and the only one
            # billed on an EC2 host. It runs exactly `pnpm test:engine` — the
            # successor-engine simulation stores, the successor chat/admin
            # routes, and the DB-backed image/identity-pack lifecycle suites —
            # plus the Gate 1 benchmark step.
            #
            # These patterns describe RISK OWNERSHIP, not the import closure.
            # The closure is useless as a criterion: 327 of the 334 modules
            # under apps/web/src/contracts are reachable from the suite's
            # module graph, as is every module of the legacy chat lane. What
            # earns an EC2 start is narrower — a defect that ONLY a real
            # database can catch: persistence and transaction semantics,
            # migration compatibility, concurrency and keyed locking,
            # DB-stored idempotency, branch/fork/replay persistence, the
            # projection stores, successor route→engine wiring, the DB-backed
            # identity-pack lifecycle, and the Docker/Postgres setup itself.
            #
            # ORDER MATTERS. A bash `case` takes the first matching arm and
            # `*` matches `/`, so each family below is followed by a wider
            # "stop" arm that swallows the rest of its directory.
            #
            # A stale glob here fails OPEN — the job simply skips and
            # aggregate `verify` stays green — so patterns are verified by
            # deliberately touching a file of each class, never by a green
            # run. `apps/web/src/contracts/simulation/*` sat in the engine
            # list below for exactly that reason: PR #106 moved those
            # contracts into @vesper/simulation-core and the dead glob went
            # unnoticed. Where a boundary is uncertain, the broader pattern
            # wins.
            case "$path" in
              # The legacy character-chat lane, with three exceptions.
              # `runSimChatExchange` — the successor turn core that
              # `chats/sim-routes.int.test.ts` drives end to end — persists
              # through `persistAssistantReply`/`pushReplyTake`
              # (chat-pipeline), `enqueueChatSummary`/`loadChatSummary`
              # (chat-summary) and `readChatEngineAuthority` (chat-authority),
              # so the EC2 suite owns those three modules' database writes.
              apps/web/src/server/engine/chat-pipeline*|apps/web/src/server/engine/chat-summary*|apps/web/src/server/engine/chat-authority*)
                integration=true
                ;;
              # The rest of the lane. `pnpm test:engine` runs NONE of its 18
              # integration suites — those are the manual `pnpm test:int`
              # surface — so an EC2 start proves nothing about them. Their
              # pure tests, typecheck and lint all run on Lambda.
              apps/web/src/server/engine/chat-*|apps/web/src/server/engine/prompts/chat-*|apps/web/src/server/engine/prompts/character-chat*)
                ;;
              # The successor engine: the simulation stores under test plus
              # the narrator, exchange, beat, time-job and surface modules the
              # route suites execute. Deliberately the whole directory —
              # this is the stateful persistence layer the job exists for.
              apps/web/src/server/engine/*)
                integration=true
                ;;
              # Server subsystems the suite runs against a real database:
              # the schema itself, the integration harness, the DB-backed
              # image/identity-pack implementation (all 61 of its modules are
              # reachable from the covered suites, so there is no honest
              # sub-boundary), the route plumbing the route suites assert on,
              # the embedding lane that writes pgvector columns, and the
              # persona/visual-state/log/event helpers the exchange calls.
              apps/web/src/server/db/*|apps/web/src/server/test-support/*|apps/web/src/server/images/*|apps/web/src/server/api/*|apps/web/src/server/ai/*|apps/web/src/server/visual-state/*|apps/web/src/server/players/*|apps/web/src/server/events.ts|apps/web/src/server/log.ts)
                integration=true
                ;;
              # Everything else under server/ — auth (every route suite
              # replaces it with `routeAuthModule`), memory, authoring,
              # reference-extraction. No `test:engine` suite executes them.
              apps/web/src/server/*)
                ;;
              # The route families the suite imports and drives: successor
              # chat + admin sim/authority, and the DB-backed identity-pack,
              # portrait and gallery routes. 56 of the 157 route modules.
              apps/web/src/app/api/chats/*|apps/web/src/app/api/admin/sim/*|apps/web/src/app/api/admin/engine-authority/*|apps/web/src/app/api/admin/self/identity-packs/*|apps/web/src/app/api/characters/*/identity-pack/*|apps/web/src/app/api/characters/*/portraits/*|apps/web/src/app/api/gallery/*)
                integration=true
                ;;
              apps/web/src/app/api/*)
                ;;
              # Image/identity contracts are the one app-contract family whose
              # payloads the covered stores write into jsonb columns, so a
              # tightened schema here can break a store write at runtime in a
              # way typecheck cannot see.
              apps/web/src/contracts/images/*)
                integration=true
                ;;
              # The rest of apps/web/src/contracts is ESLint-enforced pure (no
              # @/server imports), carries 159 co-located pure test files, and
              # owns no database behaviour: the simulation stores import zero
              # app contracts, and every persisted payload shape comes from
              # @vesper/simulation-core/contracts or @vesper/image-core, which
              # still trigger below. Lint, typecheck and the pure suite own it.
              apps/web/src/contracts/*)
                ;;
              # Story-time/beat helpers the beat and shadow modules persist
              # through, and the Vitest setup file the integration run loads.
              apps/web/src/lib/simulation/*|apps/web/src/test/*)
                integration=true
                ;;
              # Workspace packages: simulation-core is the engine kernel under
              # test, image-core types the image columns, contracts supplies
              # the determinism primitives stored hashes depend on, and
              # image-replicate supplies constants the trial/lab flows persist.
              # Kept deliberately broad — narrowing would save about one run
              # per hundred PRs and risks a silent gap.
              packages/*)
                integration=true
                ;;
              # Migrations, the migration runner, and the Compose/Postgres
              # image the job boots. `Dockerfile` is NOT here: that is the
              # application image, which this job never builds — Compose
              # builds docker/postgres/Dockerfile, matched by `docker/*`.
              # `drizzle.config.*` is NOT here either: it is drizzle-kit's
              # config, and `scripts/db-migrate.ts` hardcodes its own
              # migrations folder, so no CI job reads it.
              drizzle/*|scripts/db-*.ts|docker/*|docker-compose*.yml)
                integration=true
                ;;
              # Install and Vitest inputs. A dependency change can break the
              # suite's ability to run even when no engine source moved, so
              # these stay broad on purpose — correctness beats saving the
              # occasional EC2 start on a manifest-only PR. tsconfig is NOT
              # here: Vitest takes its `@/` alias from vitest.config.ts, and
              # typecheck on Lambda owns tsconfig correctness.
              package.json|apps/web/package.json|pnpm-lock.yaml|pnpm-workspace.yaml|vitest.config.*)
                integration=true
                ;;
              # Listed here as well as under the engine patterns below so that
              # `engine` stays a strict subset of `integration` — the Gate 1
              # benchmark runs as a step of this job, and a step cannot run in
              # a job that was skipped.
              scripts/eval/engine-gate1/*)
                integration=true
                ;;
            esac

            # `engine` gates the Gate 1 benchmark STEP inside the integration
            # job, so every pattern here must also set `integration` above.
            # The chat-lane exclusion is repeated for exactly that reason: it
            # is what keeps the benchmark from being stranded in a skipped job.
            case "$path" in
              apps/web/src/server/engine/chat-*|apps/web/src/server/engine/prompts/chat-*|apps/web/src/server/engine/prompts/character-chat*)
                ;;
              apps/web/src/server/engine/*|apps/web/src/lib/simulation/*|packages/simulation-core/*|scripts/eval/engine-gate1/*)
                engine=true
                ;;
            esac

            # Editing this workflow used to force integration + engine, so a
            # one-line CI change cost a full suite to validate. It is code, so
            # lint/static/unit still cover it; the pre-deploy dispatch is what
            # exercises every job end to end.
            case "$path" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json|apps/web/package.json|apps/web/tsconfig.json|packages/*/package.json|packages/*/tsconfig.json|apps/web/next.config.*|Dockerfile|scripts/web.mjs|apps/web/src/proxy.ts|apps/web/src/instrumentation.ts)
                build=true
                ;;
            esac
          done < changed-files.txt

          {
            echo "docs_only=$docs_only"
            echo "code=$code"
            echo "integration=$integration"
            echo "engine=$engine"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: codebuild-vesper-ci-lambda-${{ github.run_id }}-${{ github.run_attempt }}-linux-lambda-nodejs22-8GB
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-aware ESLint
        run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  static:
    name: static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: codebuild-vesper-ci-lambda-${{ github.run_id }}-${{ github.run_attempt }}-linux-lambda-nodejs22-8GB
    steps:
      - uses: actions/checkout@v4
        with:
          # lint:authz diffs the PR against origin/main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Circular-import check
        run: pnpm lint:cycles
      - name: Route-authorization guard
        run: pnpm lint:authz
      - name: Workspace import integrity
        run: pnpm lint:package-boundaries
      # Imports every workspace package by its public name through the installed
      # workspace, so a broken exports map or link cannot hide behind a tool alias.
      - name: Workspace package resolution
        run: pnpm lint:package-resolution
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Copy-paste threshold
        run: pnpm jscpd

  unit:
    name: unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: codebuild-vesper-ci-lambda-${{ github.run_id }}-${{ github.run_attempt }}-linux-lambda-nodejs22-8GB
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pure test suite
        run: pnpm test

  integration:
    name: engine integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: codebuild-vesper-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres 17 and pgvector
        run: docker compose up -d --wait
      - name: Apply migrations from zero
        run: pnpm db:migrate
      - name: Engine and rollout integration suite
        run: pnpm test:engine
        env:
          VESPER_ALLOW_LEGACY_ENGINE_TEST_PLAYER: 1
      - name: Stop successor-engine database
        if: always()
        run: docker compose down -v

      # Folded in from the former `engine benchmark` job: the eval needs no
      # database, and 25s of work was paying a second checkout + install. It
      # runs after teardown so a benchmark failure cannot leak the container,
      # and stays gated on `engine` — the classifier keeps that a subset of
      # `integration`, so this step is never stranded in a skipped job.
      - name: Gate 1 deterministic-path benchmark
        if: needs.changes.outputs.engine == 'true'
        run: pnpm eval:engine-gate1

  production-build:
    name: production build
    needs: changes
    # The slowest gate, and the one the pre-deploy dispatch always repeats, so
    # PRs pay for it only when the build surface moves (manifests, module
    # resolution, the Next or Docker build config). `build` is forced true for
    # workflow_dispatch and for prod-bound PRs, so the release-candidate run
    # and every promotion still build.
    if: needs.changes.outputs.build == 'true'
    runs-on: codebuild-vesper-ci-lambda-${{ github.run_id }}-${{ github.run_attempt }}-linux-lambda-nodejs22-8GB
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next.js production build
        run: pnpm build
        env:
          # Same heap ceiling as the Dockerfile build stage — a build that
          # would OOM on the Fly builder must fail here, on the PR, first.
          NODE_OPTIONS: --max-old-space-size=4096

  verify:
    name: verify
    # always() so one failed gate can't hide behind a skipped dependent, but
    # never on drafts — a draft must show no `verify` at all, not a green one.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - changes
      - lint
      - static
      - unit
      - integration
      - production-build
    runs-on: codebuild-vesper-ci-lambda-${{ github.run_id }}-${{ github.run_attempt }}-linux-lambda-nodejs22-4GB
    steps:
      - name: Require every applicable gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail
          for result in \
            "$CHANGES_RESULT" \
            "$LINT_RESULT" \
            "$STATIC_RESULT" \
            "$UNIT_RESULT" \
            "$INTEGRATION_RESULT" \
            "$BUILD_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "An applicable CI job ended with: $result"
              exit 1
            fi
          done

          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Documentation-only change: code gates intentionally skipped."
          else
            echo "All applicable CI gates passed."
          fi
