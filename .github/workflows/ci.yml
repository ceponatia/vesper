name: CI

# Runs the project's canonical gate (`pnpm verify` = lint + typecheck + test +
# jscpd) on every PR and push to the long-lived environment branches. The job
# name below ("verify") is the status-check context that `prod` branch
# protection requires before a promotion PR can merge.
on:
  pull_request:
    branches: [main, prod, engine]
  push:
    branches: [main, prod, engine]

# A newer push to the same ref cancels the in-flight run — saves CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Skip the husky git-hook install in CI (no commits happen here).
          HUSKY: 0

      - name: Verify (lint + typecheck + test + jscpd)
        run: pnpm verify

      - name: Gate 1 deterministic-path benchmark
        run: pnpm eval:engine-gate1

      - name: Start Postgres 17 + pgvector for successor engine
        run: docker compose up -d --wait

      - name: Apply migrations from zero
        run: pnpm db:migrate

      - name: E2.2 durable branch transaction integration
        run: pnpm test:engine-e2-2

      - name: E2.3 outbox and rebuildable consumer integration
        run: pnpm test:engine-e2-3

      - name: E2.4 durable scheduler integration
        run: pnpm test:engine-e2-4

      - name: E2.5 forks, snapshots, and audit integration
        run: pnpm test:engine-e2-5

      - name: E2.6 Gate 2 soak (CI profile)
        run: pnpm test:engine-e2-6

      - name: E3.1 authoritative space integration
        run: pnpm test:engine-e3-1

      - name: E3.2 activities and claims integration
        run: pnpm test:engine-e3-2

      - name: E3.3 commitments and pressure integration
        run: pnpm test:engine-e3-3

      - name: E3.4 engagement substrate integration
        run: pnpm test:engine-e3-4

      - name: E3.5 arbiter, access, and Gate 3 corpus integration
        run: pnpm test:engine-e3-5

      - name: Stop successor-engine database
        if: always()
        run: docker compose down -v
