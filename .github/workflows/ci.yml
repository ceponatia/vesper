name: CI

# Runs the project's canonical gates on every PR and push to the long-lived
# environment branches. The gates run as SEPARATE sequential steps, never the
# chained `pnpm verify` — the chain holds every process's memory at once and
# OOM-killed the runner from 2026-07-20 (type-aware ESLint alone peaks ~3 GB;
# the same reason CLAUDE.md bans `pnpm verify` locally). One process per step
# lets each fully exit and release its heap before the next starts. The job
# name below ("verify") is the status-check context that `prod` branch
# protection requires before a promotion PR can merge.
on:
  pull_request:
    branches: [main, prod, engine]
  push:
    branches: [main, prod, engine]

# A newer push to the same ref cancels the in-flight run — saves CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Skip the husky git-hook install in CI (no commits happen here).
          HUSKY: 0

      - name: Lint (type-aware, max-warnings 0)
        run: pnpm lint
        env:
          # Headroom for the type-aware pass — Node's default heap cap is
          # what actually OOMed, well under the runner's ~7 GB.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Circular-import check (madge)
        run: pnpm lint:cycles

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Pure test suite
        id: pure_tests
        shell: bash
        run: |
          set +e
          pnpm test > pure-test.log 2>&1
          code=$?
          cat pure-test.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pure-test diagnostics
        if: steps.pure_tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pure-test-diagnostics
          path: pure-test.log
          retention-days: 1

      - name: Enforce pure-test result
        if: steps.pure_tests.outputs.exit_code != '0'
        run: exit "${{ steps.pure_tests.outputs.exit_code }}"

      - name: Copy-paste threshold (jscpd)
        run: pnpm jscpd

      - name: Gate 1 deterministic-path benchmark
        run: pnpm eval:engine-gate1

      - name: Start Postgres 17 + pgvector for successor engine
        run: docker compose up -d --wait

      - name: Apply migrations from zero
        run: pnpm db:migrate

      # One glob-driven step replaces the old per-E-package enumeration
      # (simplified 2026-07-21, owner ruling): vitest discovers every suite
      # under the engine + rollout surface, so a deleted or renamed file can
      # never leave a step pointing at nothing (the E2.2/E2.3 ghost), each
      # file runs exactly once (the per-package scripts re-ran shared suites
      # many times), and one vitest cold-start replaces ~25. The per-package
      # test:engine-e* / test:rollout-r* scripts remain in package.json as
      # local conveniences only.
      - name: Engine + rollout integration suite
        run: pnpm test:engine
        env:
          # Low-level engine suites historically seed bare branches and submit
          # the shared synthetic player fixture. Authorization tests do not set
          # this flag and continue proving that ordinary unanchored players fail.
          VESPER_ALLOW_LEGACY_ENGINE_TEST_PLAYER: 1

      - name: Stop successor-engine database
        if: always()
        run: docker compose down -v
