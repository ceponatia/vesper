# fly.toml app configuration file generated for vesper on 2026-06-25T15:58:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vesper'
primary_region = 'iad'

[build]

[deploy]
  # `-w` pins this to the WORKSPACE ROOT script. The repository root and
  # apps/web are both pnpm workspaces now, so an unqualified `pnpm db:migrate`
  # would become ambiguous the moment the app ever defines a script of the same
  # name — and a release command that silently ran the wrong migration is not a
  # failure you find quickly.
  release_command = 'pnpm -w run db:migrate'

[[mounts]]
  source = 'vesper_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
