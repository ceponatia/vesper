app = 'vesper'
primary_region = 'iad'

[build]

[deploy]
  # Applies pending drizzle migrations before the new release goes live.
  # Requires DATABASE_URL (Neon) to be set as a secret first.
  release_command = "pnpm db:migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # MUST stay up — in-process job worker loop
  auto_start_machines = true
  min_machines_running = 1         # never scale to zero
  processes = ['app']

[[mounts]]
  source = "vesper_data"           # persistent image storage (DATA_ROOT=/app/data)
  destination = "/app/data"

[[vm]]
  memory = '2gb'                   # 256mb OOMs Next instantly; 1gb is the floor
  cpu_kind = 'shared'
  cpus = 1
